# Response headers for the local preview container, kept in step with the three
# deploy targets: the `headers` array in vercel.json, the `[[headers]]` blocks
# in netlify.toml and the `/*` rules in public/_headers.
#
# This is a separate file because of how nginx inherits `add_header`. A location
# block that sets any header of its own stops inheriting the server block's
# list entirely — so `/_astro/`, which sets Cache-Control, would be served with
# none of these if they were written once at server level. Each location that
# sets a header of its own includes this file as well.
#
# `always` on each one: without it nginx attaches a header only to a successful
# response, and the two responses most worth protecting here are a 404 and the
# 501 from /api/.
#
# Strict-Transport-Security is deliberately absent. The other three targets send
# it and this container does not, because it serves plain HTTP on localhost.
# A browser ignores the header over HTTP, so sending it would do nothing — and
# `localhost` is one host shared by every project on the machine, so a browser
# that did honour it would force HTTPS on every other local server too.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
