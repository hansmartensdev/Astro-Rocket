name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here reads the repository and writes nothing back. Without this,
# jobs get the default token, which on a push to this repository can write to
# it — so an action or a dependency with an install script would be running
# with push rights it has no use for.
permissions:
  contents: read

jobs:
  quality:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose: pnpm/action-setup reads `packageManager`
      # from package.json, so CI, Docker and a developer's machine cannot
      # drift onto three different pnpm versions.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test:run

      # Reported, never blocking. A theme is cloned and then lives in somebody
      # else's repository, so the useful thing is that the number is visible on
      # every run and its direction is known — not that a transitive advisory
      # with no patch available can stop a documentation fix from merging.
      #
      # Build tooling is where almost all of these live, which is why the
      # production tree is reported separately: a finding there is one a
      # deployed site could plausibly reach, and a finding in the full tree is
      # usually one that only ever runs on a developer's machine.
      - name: Dependency advisories
        continue-on-error: true
        run: |
          {
            echo '### Dependency advisories'
            echo
            echo 'Production dependencies:'
            echo '```'
            pnpm audit --prod 2>&1 | tail -2 || true
            echo '```'
            echo 'Everything, build tooling included:'
            echo '```'
            pnpm audit 2>&1 | tail -2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every deploy target gets built and inspected.
  #
  # Both Cloudflare failures in #600 shipped because nothing here ever built
  # anything but the default adapter. One of them died loudly; the other
  # reported a completely successful build and wrote 89 pages containing the
  # string "[object Object]". So a green exit code is not the test — the
  # verify step reads the output back and is what actually catches that.
  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [vercel, netlify, cloudflare]
    steps:
      - uses: actions/checkout@v7
      # No version here on purpose: pnpm/action-setup reads `packageManager`
      # from package.json, so CI, Docker and a developer's machine cannot
      # drift onto three different pnpm versions.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Only the Vercel adapter is a dependency of the theme, so the other two
      # targets install theirs first — the same extra step the README gives a
      # site deploying to those platforms. This leg is therefore also the test
      # that the documented command is the right one.
      - name: Install the adapter for this target
        if: matrix.target != 'vercel'
        run: pnpm add -D @astrojs/${{ matrix.target }}

      # The failure path of the same mechanism, on the one leg that has no
      # extra adapter installed: asking for a target whose adapter is absent
      # has to stop the build and name the package to install. Without this,
      # a config that silently fell back to Vercel would deploy the wrong
      # output to Netlify and every leg here would still be green.
      - name: A missing adapter stops the build and says which one
        if: matrix.target == 'vercel'
        env:
          DEPLOY_TARGET: netlify
          SITE_URL: https://example.com
        run: |
          if pnpm run build > missing-adapter.log 2>&1; then
            echo "::error::the build succeeded with no Netlify adapter installed"
            exit 1
          fi
          grep -q '@astrojs/netlify' missing-adapter.log || {
            echo "::error::the failure never named the package to install"
            cat missing-adapter.log
            exit 1
          }

      - name: Build
        run: pnpm run build
        env:
          # `vercel` is the default and takes no DEPLOY_TARGET.
          DEPLOY_TARGET: ${{ matrix.target != 'vercel' && matrix.target || '' }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://example.com' }}

      - name: Verify the output is a usable site
        run: pnpm run verify

  # The container is documented in the README, so it has to keep working.
  # Nothing else here would notice it breaking: it is not part of `validate`,
  # and a developer who never runs Docker would not see it fail.
  docker:
    name: Local preview container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Through compose rather than `docker build`, because compose is what the
      # README tells people to run and what carries the configuration into the
      # build. Compose resolves these from the environment exactly as it
      # resolves them from a developer's `.env`.
      - name: Serve it
        env:
          SITE_URL: https://ci.example
          PUBLIC_GA_MEASUREMENT_ID: G-CITEST123
          PUBLIC_GTM_ID: GTM-CITEST
          PUBLIC_UMAMI_WEBSITE_ID: ci-umami-website-id
          PUBLIC_UMAMI_SRC: https://umami.ci.example/script.js
          PUBLIC_GOOGLE_MAPS_API_KEY: ci-maps-key
          PUBLIC_CONSENT_ENABLED: 'true'
          PUBLIC_PRIVACY_POLICY_URL: /ci-privacy-check
          GOOGLE_SITE_VERIFICATION: ci-google-token
          BING_SITE_VERIFICATION: ci-bing-token
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4321/ > /dev/null && ready=1 && break
            sleep 1
          done
          # Without this the loop simply ends and the step passes: its last
          # command is `sleep`, which succeeds. A readiness check that cannot
          # report a dead container is not a check.
          if [ -z "$ready" ]; then
            echo "::error::the container did not answer on :4321 within 30s"
            docker compose logs --no-color
            exit 1
          fi

      - name: The home page is served
        run: curl -fsS http://localhost:4321/ | grep -q '<title>'

      - name: A nested page is served
        run: curl -fsS http://localhost:4321/blog/ | grep -q '<title>'

      # SITE_URL reaches the build through compose, so a preview built with an
      # address writes that address and not the localhost default.
      - name: The preview writes the address it was given
        run: |
          curl -fsS http://localhost:4321/ -o home.html
          grep -q 'rel="canonical" href="https://ci.example/"' home.html

      # Astro inlines these at build time and all of them are optional, so a
      # build that never received them still succeeds. Reading them back out
      # of the served page is what catches a missing one.
      #
      # PUBLIC_GOOGLE_MAPS_API_KEY is passed to the build but not asserted:
      # GoogleMap is rendered on no page of the demo, so the key has nothing
      # to appear in.
      - name: The preview carries the configuration it was given
        run: |
          curl -fsS http://localhost:4321/ -o config.html
          for value in \
            G-CITEST123 \
            GTM-CITEST \
            ci-umami-website-id \
            umami.ci.example/script.js \
            /ci-privacy-check \
            ci-google-token \
            ci-bing-token \
            'id="consent-banner"'
          do
            grep -qF "$value" config.html || {
              echo "::error::$value never reached the built site"
              exit 1
            }
          done

      # The static build has no API routes. nginx has to say so in the shape
      # the contact form parses, or the form shows "Failed to send message"
      # and the reason is lost.
      - name: The API routes answer honestly
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' -X POST http://localhost:4321/api/contact)
          test "$code" = "501"
          node -e "const b=require('./body.json'); if(b.success!==false||!b.errors?.form?.[0]) process.exit(1)"

      - name: A missing page is a 404
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4321/no-such-page/)" = "404"

      # The three deploy targets send these through vercel.json, netlify.toml
      # and public/_headers; the container sends them through nginx. Reading
      # them back off four different kinds of response is the point, because
      # each one is a way nginx drops them silently: a location block that sets
      # a header of its own stops inheriting the server block's, and a header
      # without `always` is attached to successful responses only — which is
      # every response except the two below.
      #
      # Strict-Transport-Security is not checked. The other targets send it and
      # the container does not, for the reason in nginx-security-headers.conf.
      - name: Every response carries the security headers
        run: |
          astro_asset=$(curl -fsS http://localhost:4321/ | grep -oE '/_astro/[A-Za-z0-9._-]+\.(css|js)' | head -1)
          test -n "$astro_asset" || {
            echo "::error::found no /_astro/ asset on the home page to check"
            exit 1
          }
          for path in / no-such-page/ api/contact "${astro_asset#/}"; do
            headers=$(curl -sS -D - -o /dev/null "http://localhost:4321/$path")
            for header in \
              'x-content-type-options: nosniff' \
              'x-frame-options: DENY' \
              'referrer-policy: strict-origin-when-cross-origin' \
              'permissions-policy: camera=(), microphone=(), geolocation=()'
            do
              printf '%s' "$headers" | tr -d '\r' | grep -qiF "$header" || {
                echo "::error::/$path was served without '$header'"
                printf '%s' "$headers"
                exit 1
              }
            done
          done

      # server_tokens off. nginx otherwise names its exact version in every
      # response, which tells a scanner which nginx advisories to try.
      - name: The server does not advertise its version
        run: |
          server=$(curl -sS -D - -o /dev/null http://localhost:4321/ | tr -d '\r' | grep -i '^server:')
          echo "$server"
          printf '%s' "$server" | grep -qE '[0-9]+\.[0-9]+' && {
            echo "::error::the Server header carries a version: $server"
            exit 1
          }
          exit 0

      # The export service builds the files that go on a host, so the address
      # in them matters. The build-time guards cannot catch a wrong one — they
      # compare the canonical against the JSON-LD, which agree either way — so
      # this reads it out of the output.
      - name: The export writes what it was given
        env:
          SITE_URL: https://ci.example
          PUBLIC_GA_MEASUREMENT_ID: G-CITEST123
          PUBLIC_GTM_ID: GTM-CITEST
          PUBLIC_UMAMI_WEBSITE_ID: ci-umami-website-id
          PUBLIC_UMAMI_SRC: https://umami.ci.example/script.js
          PUBLIC_GOOGLE_MAPS_API_KEY: ci-maps-key
          PUBLIC_CONSENT_ENABLED: 'true'
          PUBLIC_PRIVACY_POLICY_URL: /ci-privacy-check
          GOOGLE_SITE_VERIFICATION: ci-google-token
          BING_SITE_VERIFICATION: ci-bing-token
        run: |
          docker compose --profile export run --rm export
          grep -q 'rel="canonical" href="https://ci.example/"' dist/index.html
          grep -q '<loc>https://ci.example/</loc>' dist/sitemap-0.xml
          # These files are the ones that go on a host, so what is missing from
          # them is missing from a live site.
          for value in G-CITEST123 ci-google-token 'id="consent-banner"'; do
            grep -qF "$value" dist/index.html || {
              echo "::error::$value never reached the exported files"
              exit 1
            }
          done

      - name: Stop
        if: always()
        run: docker compose --profile export down -v --remove-orphans || true

# Deployment is left to the platform's own Git integration by default.
# To deploy from here instead, add one of these to a job that runs after
# `build`, guarded by `if: github.ref == 'refs/heads/main'`:
#
#   Vercel      amondnet/vercel-action@v25
#               vercel-token / vercel-org-id / vercel-project-id, args '--prod'
#   Netlify     nwtgck/actions-netlify@v2
#               publish-dir './dist', NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
#   Cloudflare  cloudflare/wrangler-action@v3
#               apiToken, accountId, command 'deploy'
